<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #111, #000);
  color: #fff;
  text-align: center;
}

/* LOGO */
.logo-wrapper {
  margin-top: 40px;
  text-align: center;
}

.logo-card {
  display: inline-block;
  padding: 25px 35px;
  border-radius: 25px;
  background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
  border: 1px solid #2a2a2a;
  box-shadow: 0 0 40px rgba(0,0,0,0.9),
              0 0 25px rgba(59,130,246,0.25);
  margin-bottom: 40px;
  transition: 0.3s;
}

.logo-card:hover {
  transform: scale(1.03);
  box-shadow: 0 0 50px rgba(59,130,246,0.4);
}

.logo-card img {
  width: min(380px, 80vw);
}

/* CONTAINER */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 60px 20px;
}

h1 {
  font-size: 34px;
  margin-bottom: 20px;
}

p {
  color: #ccc;
  line-height: 1.6;
}

/* BOTÕES */
.buttons {
  margin-top: 30px;
}

.buttons a {
  display: inline-block;
  margin: 10px;
  padding: 10px 18px;
  border-radius: 20px;
  border: 1px solid #3b82f6;
  color: #3b82f6;
  text-decoration: none;
}

/* ================= PLANOS BASE ================= */
.plans {
  display: grid;
  grid-template-columns: 1fr;
  gap: 30px;
  margin-top: 60px;
}

@media (min-width: 768px) {
  .plans {
    grid-template-columns: 1fr 1fr;
  }
}

.plan {
  background: #111;
  padding: 30px;
  border-radius: 20px;
  border: 1px solid #333;
  text-align: left;
  position: relative;
  color: #fff;
}

/* PREÇO */
.price {
  font-size: 42px;
  font-weight: 900;
  margin-top: 10px;
  color: #fff;
  text-shadow: 0 0 12px rgba(255,255,255,0.15);
}

/* TEXTO SECUNDÁRIO */
.small {
  font-size: 15px;
  color: #d1d5db;
  margin-bottom: 15px;
  letter-spacing: 0.2px;
}

/* ================= GOLD ================= */
.gold {
  border: 2px solid #facc15;
  box-shadow: 0 0 30px rgba(250, 204, 21, 0.35);
}

.gold h2 {
  color: #facc15;
  font-weight: 800;
}

.gold-time {
  color: #facc15;
  font-weight: 700;
  font-size: 16px;
  margin: 5px 0 10px;
  text-shadow: 0 0 10px rgba(250,204,21,0.4);
}

.gold .price {
  color: #facc15;
  text-shadow: 0 0 18px rgba(250,204,21,0.6);
}

.gold-btn {
  background: linear-gradient(90deg, #facc15, #eab308, #f59e0b);
}

/* ================= PLATINUM ================= */
.platinum {
  border: 2px solid #60a5fa;
  transform: scale(1.08);
  background: linear-gradient(145deg, #0f172a, #020617);
  box-shadow: 0 0 40px rgba(96,165,250,0.45);
  transition: 0.3s;
}

.platinum:hover {
  transform: scale(1.12);
  box-shadow: 0 0 65px rgba(96,165,250,0.7);
}

.platinum h2 {
  color: #93c5fd;
  font-weight: 800;
}

.platinum-time {
  color: #60a5fa;
  font-weight: 700;
  font-size: 16px;
  margin: 5px 0 10px;
  text-shadow: 0 0 10px rgba(96,165,250,0.4);
}

.platinum .price {
  color: #60a5fa;
  text-shadow: 0 0 18px rgba(96,165,250,0.7);
}

.platinum-btn {
  background: linear-gradient(90deg, #60a5fa, #3b82f6, #1d4ed8);
}

/* BOTÃO BASE */
.btn {
  display: block;
  margin-top: 20px;
  padding: 12px;
  border-radius: 10px;
  text-decoration: none;
  color: #fff;
  text-align: center;
  font-weight: bold;
}

/* SEÇÕES */
.section {
  margin-top: 80px;
}

.faq {
  background: #111;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
  text-align: left;
}
</style>
